apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: content-cert
  namespace: istio-system
spec:
  secretName: content-tls
  dnsNames:
    - content.erminstudio.com
  issuerRef:
    kind: ClusterIssuer
    name: rancher-ca-issuer
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: content-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts: [content.erminstudio.com]
      port: {name: http, number: 80, protocol: HTTP}
    - hosts: [content.erminstudio.com]
      port: {name: https, number: 443, protocol: HTTPS}
      tls:
        mode: SIMPLE
        credentialName: content-tls
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: content
  namespace: minio
spec:
  gateways: [istio-system/content-gateway]
  hosts: [content.erminstudio.com]
  http:
    # RustFS console lives under /rustfs/console/; send a plain browser visit to the bare
    # host there. Signed S3 calls to "/" (ListBuckets, used by the console's Key Login)
    # carry an Authorization header and must reach RustFS, not be redirected.
    - match:
        - uri:
            exact: /
          withoutHeaders:
            authorization:
              regex: ".+"
      redirect:
        uri: /rustfs/console/
    # RustFS port 9001 serves the console, its API calls and the OIDC callback
    - headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: rustfs.minio.svc.cluster.local
            port:
              number: 9001
