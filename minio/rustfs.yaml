# RustFS: S3-compatible replacement for MinIO (see rustfs-migration-runbook.md).
# The `minio` Service keeps its name so every client (Loki, Mimir, Tempo, Keycloak backup,
# content app) keeps using minio.minio.svc.cluster.local:9000 unchanged.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: minio
  labels:
    app: rustfs
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: minio
  labels:
    app: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: rustfs
          # Mirror of rustfs/rustfs:1.0.2
          image: ermin700/rustfs:1.0.2
          command: ["/usr/bin/rustfs"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: rootUser}
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: rootPassword}
            - {name: RUSTFS_VOLUMES, value: /data}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "true"}
            - {name: RUSTFS_CONSOLE_ADDRESS, value: ":9001"}
            - {name: RUSTFS_REGION, value: us-east-1}
            - {name: RUSTFS_OBS_LOG_DIRECTORY, value: /logs}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: info}
            # SSO via Keycloak (realm erminstudio, client minio). The `policy` claim carries
            # consoleAdmin/readwrite/readonly, which match RustFS's built-in policies.
            - {name: RUSTFS_BROWSER_REDIRECT_URL, value: "https://content.erminstudio.com"}
            - {name: RUSTFS_IDENTITY_OPENID_ENABLE, value: "on"}
            # Issuer URL (RustFS appends /.well-known/...); must match the token issuer
            - {name: RUSTFS_IDENTITY_OPENID_CONFIG_URL, value: "https://keycloak.erminstudio.com/realms/erminstudio"}
            - {name: RUSTFS_IDENTITY_OPENID_CLIENT_ID, value: minio}
            - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: minio-oidc, key: client_secret}
            - {name: RUSTFS_IDENTITY_OPENID_SCOPES, value: "openid,profile,email"}
            - {name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI, value: "https://content.erminstudio.com/rustfs/admin/v3/oidc/callback/default"}
            - {name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC, value: "off"}
            - {name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM, value: policy}
            - {name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME, value: Keycloak}
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          livenessProbe:
            httpGet: {path: /health, port: 9000}
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
