# In-cluster HTTPS route to Keycloak for RustFS's OIDC client.
# RustFS sends no User-Agent header, and Cloudflare challenges such requests (403), so
# RustFS can't use the public keycloak.erminstudio.com. Instead, rustfs-0 resolves that
# name to the Istio ingress gateway (hostAliases in rustfs.yaml) and reaches Keycloak here,
# over TLS signed by the internal rancher-ca. Same hostname, so the token issuer matches.
# Browsers still use the public URL through Cloudflare; this route is cluster-only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-internal-cert
  namespace: istio-system
spec:
  secretName: keycloak-internal-tls
  dnsNames:
    - keycloak.erminstudio.com
  issuerRef:
    kind: ClusterIssuer
    name: rancher-ca-issuer
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: keycloak-internal-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts: [keycloak.erminstudio.com]
      port: {name: https-keycloak-internal, number: 443, protocol: HTTPS}
      tls:
        mode: SIMPLE
        credentialName: keycloak-internal-tls
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycloak-internal
  namespace: minio
spec:
  gateways: [istio-system/keycloak-internal-gateway]
  hosts: [keycloak.erminstudio.com]
  http:
    - headers:
        request:
          set:
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      route:
        - destination:
            host: keycloak-service.keycloak.svc.cluster.local
            port:
              number: 8080
---
# Public CA certificate of the rancher-ca ClusterIssuer (valid to 2036), trusted by RustFS
# via SSL_CERT_FILE so it accepts keycloak-internal-tls.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-trusted-ca
  namespace: minio
