# Helm values for Grafana in the "observability" namespace (chart grafana/grafana 10.5.15).
# Install / upgrade: see README.md in this directory.
#
# Secrets are referenced, never stored here:
#   grafana-admin  - local admin username/password
#   grafana-oauth  - Keycloak "grafana" client secret (key: client_secret)

admin:
  existingSecret: grafana-admin

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        uid: mimir
        url: http://mimir-gateway.observability.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          timeInterval: 60s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki-gateway.observability.svc.cluster.local
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          serviceMap:
            datasourceUid: mimir
          tracesToLogsV2:
            datasourceUid: loki
      - name: Istio Prometheus
        type: prometheus
        uid: istio-prom
        url: http://prometheus.istio-system.svc.cluster.local:9090
        jsonData:
          httpMethod: GET

deploymentStrategy:
  type: Recreate

initChownData:
  enabled: false

persistence:
  enabled: true
  size: 2Gi

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oauth
      key: client_secret

grafana.ini:
  server:
    root_url: https://grafana.erminstudio.com

  # SSO via Keycloak (realm "erminstudio", client "grafana")
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    icon: signin
    allow_sign_up: true
    auto_login: false
    client_id: grafana
    scopes: openid email profile offline_access
    use_pkce: true
    use_refresh_token: true
    # Browser-facing endpoint goes through Cloudflare; server-to-server calls stay in-cluster
    auth_url: https://keycloak.erminstudio.com/realms/erminstudio/protocol/openid-connect/auth
    token_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/erminstudio/protocol/openid-connect/token
    api_url: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/erminstudio/protocol/openid-connect/userinfo
    signout_redirect_url: https://keycloak.erminstudio.com/realms/erminstudio/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.erminstudio.com%2Flogin
    login_attribute_path: preferred_username
    email_attribute_path: email
    name_attribute_path: name
    # Keycloak "grafana" client roles -> Grafana org role
    role_attribute_path: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
