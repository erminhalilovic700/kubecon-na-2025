apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # The CRD is created in the same sync, so skip dry-run on first install
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-postgres18
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db
      key: username
    passwordSecret:
      name: keycloak-db
      key: password
  hostname:
    hostname: https://keycloak.erminstudio.com
  # TLS is terminated at Cloudflare; Istio forwards plain HTTP to Keycloak
  http:
    httpEnabled: true
  proxy:
    headers: xforwarded
  # Exposed through the Istio Gateway in istio.yaml instead
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
