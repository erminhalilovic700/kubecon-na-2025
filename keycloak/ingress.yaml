apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-ca-issuer
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - keycloak.10.0.0.100.sslip.io
      secretName: keycloak-tls
  rules:
    - host: keycloak.10.0.0.100.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # Service created by the Keycloak Operator: <keycloak-name>-service
                name: keycloak-service
                port:
                  number: 8080
