# One ExternalSecret per Kubernetes Secret. Each pulls every key in the Infisical folder
# /<namespace>/<secret> (project erminstudio, environment prod) into a Secret of the same name.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: keycloak-db-infisical-check
    creationPolicy: Owner
  dataFrom:
    - find:
        path: /keycloak/keycloak-db
        name:
          regexp: ".*"
---
