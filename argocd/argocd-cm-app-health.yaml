# Health check for Application resources, needed by the sync waves in argo/root.yaml.
# Argo CD doesn't assess a child Application's health by default, so without this the root app
# would start every wave at once. Merge it into the live argocd-cm:
#
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file argocd/argocd-cm-app-health.yaml
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
