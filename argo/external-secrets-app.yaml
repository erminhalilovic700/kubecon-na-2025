apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    # External Secrets Operator (installs its CRDs)
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0
      helm:
        releaseName: external-secrets
    # ClusterSecretStore + ExternalSecrets
    - repoURL: https://github.com/erminhalilovic700/kubecon-na-2025.git
      targetRevision: main
      path: external-secrets/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # ESO's CRDs are too large for client-side apply
