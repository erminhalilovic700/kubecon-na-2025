apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: 2.3.4
    helm:
      releaseName: crossplane
      # Same values as the Helm release on RKE2 (helm get values crossplane -n crossplane-system)
      valuesObject:
        args: ["--debug"]
        metrics:
          enabled: true
        packageCache:
          sizeLimit: 1Gi
        resourcesCrossplane:
          limits: {cpu: 500m, memory: 1024Mi}
          requests: {cpu: 100m, memory: 256Mi}
        resourcesRBACManager:
          limits: {cpu: 100m, memory: 512Mi}
          requests: {cpu: 100m, memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
